services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: ssp, POSTGRES_PASSWORD: ssp, POSTGRES_DB: ssp }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ssp:ssp@db:5432/ssp
      REDIS_URL: redis://redis:6379/0
    volumes: [models:/srv/data]
    depends_on: [db, redis]
    ports: ["8000:8000"]
  worker:
    build: ./backend
    command: celery -A app.worker worker -B --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ssp:ssp@db:5432/ssp
      REDIS_URL: redis://redis:6379/0
    volumes: [models:/srv/data]
    depends_on: [db, redis]
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_ORG_NAME: ${NEXT_PUBLIC_ORG_NAME:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { pgdata: {}, models: {} }
